
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - HelpDesk</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-box">
        <h2>HelpDesk Login</h2>
        <p class="subtitle">Please enter your credentials to continue</p>

        <!-- Submits straight to dashboard.html on validation pass -->
        <form action="dashboard.html" method="get">
            <div class="form-group">
                <label for="userName">Full Name</label>
                <input type="text" id="userName" name="userName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="userEmail">Email Address</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="student@example.com" required>
            </div>

            <div class="form-group">
                <label for="userPass">Password</label>
                <input type="password" id="userPass" name="userPass" placeholder="Enter password" required
                    minlength="4">
            </div>

            <button type="submit" class="btn btn-full">Login</button>
        </form>

        <p style="text-align: center; margin-top: 18px; font-size: 13px;">
            Don't have an account? <a href="signup.html">Register here</a>
        </p>
    </div>
    <script src="script.js"></script>

</body>

</html>
