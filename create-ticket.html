
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Ticket - HelpDesk</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <h2>HelpDesk Portal</h2>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="create-ticket.html" class="active">Create Ticket</a>
            <a href="all-tickets.html">All Tickets</a>
            <a href="agents.html">Support Staff</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>

    <main class="container">
        <div class="card">
            <h2>Raise a Support Ticket</h2>
            <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">
                All fields marked with an asterisk (*) are required.
            </p>

            <!-- Submits to ticket-success.html without any JS -->
            <form id="ticketForm">
                <div class="form-group">
                    <label for="ticketTitle">Issue Title *</label>
                    <input type="text" id="ticketTitle" name="title" placeholder="Brief summary of your problem" required>
                </div>
            
                <div class="form-group">
                    <label for="studentName">Your Full Name *</label>
                    <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
                </div>
            
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="IT & Wi-Fi Support">IT & Wi-Fi Support</option>
                        <option value="Fee & Accounts">Fee & Accounts</option>
                        <option value="Hostel & Mess">Hostel & Mess</option>
                        <option value="Library Services">Library Services</option>
                        <option value="Academics">Academics</option>
                    </select>
                </div>
            
                <div class="form-group">
                    <label for="priority">Priority Level *</label>
                    <select id="priority" name="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
            
                <div class="form-group">
                    <label for="description">Detailed Description *</label>
                    <textarea id="description" name="desc" rows="5" placeholder="Explain the problem in detail..."
                        required></textarea>
                </div>
            
                <button type="submit" class="btn">Submit Ticket</button>
            </form>
            
            <script src="script.js"></script>
        </div>
    </main>

</body>

</html>
